name: Sync Karta to gh-pages branch

on:
  push:
    branches: ["main"]
    paths:
      - "apps/karta/decomposition/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/karta/decomposition
          publish_branch: gh-pages
          keep_files: false
          enable_jekyll: false
