      // Universal Snapshot Runtime Shim
      (function() {
      function initUniversalSnapshot() {
      // 1. Universal Cookie / Dialog Dismissal Handler (Capture Phase)
      function setupDismissableBanners() {
      const STORAGE_KEY = 'snapshot_cookie_consent';
      let isDismissed = null;
      try { isDismissed = localStorage.getItem(STORAGE_KEY); } catch (_) {}
      const isConsentDialog = (el) => /cookie|consent|privacy/i.test(
      [el.id, typeof el.className === 'string' ? el.className : '', el.textContent || ''].join(' ')
      );
      const dialogs = [...document.querySelectorAll('[role="dialog"], [class*="cookie"], [class*="consent"], [id*="cookie"], [id*="consent"]')]
      .filter(isConsentDialog);
      if (isDismissed === 'accepted' || isDismissed === 'declined') {
      dialogs.forEach(d => d.remove());
      return;
      }
      document.addEventListener('click', function(e) {
      const btn = e.target.closest('button');
      if (!btn) return;
      const dialog = btn.closest('[role="dialog"], [class*="cookie"], [class*="consent"], [id*="cookie"], [id*="consent"]');
      if (dialog && isConsentDialog(dialog)) {
      e.preventDefault();
      e.stopPropagation();
      const text = (btn.textContent || '').trim();
      const choice = text.includes('ยอมรับ') || text.toLowerCase().includes('accept') ? 'accepted' : 'declined';
      try { localStorage.setItem(STORAGE_KEY, choice); } catch (_) {}
      dialog.remove();
      }
      }, true);
      }
      
      // 2. Astro / React Island Rehydration Bridge
      function rehydrateIslands() {
      const islands = document.querySelectorAll('astro-island');
      islands.forEach(async (island) => {
      // Preserve the captured visual state. Forcing entrance animations back to
      // opacity: 0 leaves static snapshots invisible because no animation driver
      // may run after the original page runtime has been removed.
      
      // React hydrator requires 'ssr' attribute
      if (!island.hasAttribute('ssr')) {
      island.setAttribute('ssr', '');
      }
      
      if (typeof island.hydrate === 'function') {
      try {
      await island.hydrate();
      } catch (err) {
      console.warn('[SnapshotHydrator] Failed to rehydrate island:', island, err);
      }
      }
      });
      }
      
      setupDismissableBanners();
      setTimeout(rehydrateIslands, 60);
      }
      
      if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => setTimeout(initUniversalSnapshot, 50));
      } else {
      setTimeout(initUniversalSnapshot, 50);
      }
      })();
    </script>
  </body>
